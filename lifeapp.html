<script>
const sb=supabase.createClient(CFG.U,CFG.K),$=i=>document.getElementById(i);let P=[],MT=false,idle;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bad=v=>/^\s*(javascript|data|vbscript):/i.test(String(v||''));

['click','keydown','touchstart'].forEach(e=>addEventListener(e,()=>{if($('ap').style.display!=='none')rst()}));
const THEMES=[['neon','🌌 নিয়ন (ডিফল্ট)','#b44cff,#00e5ff','#0b0b1e','#eee'],['sunset','🌇 সানসেট','#ff3d7f,#ffb020','#1a0c14','#eee'],['ocean','🌊 ওশান','#2f8dff,#2ee6c5','#06141f','#eee'],['light','☀️ লাইট (সাদা)','#7c3aed,#00a6d6','#eef2ff','#222']];
const TH_KEYS=THEMES.map(t=>t[0]);
let TH='neon',AT=document.documentElement.getAttribute('data-at')||'neon';

function renderTh(){const e=$('thc');if(!e)return;e.innerHTML=`<div class="card"><h3>🎨 সাইটের থিম</h3><small>যেটায় ক্লিক করবেন সেটাই সাথে সাথে সেভ হবে। ভিজিটররা সাইট রিলোড দিলে নতুন থিম দেখবে।</small><div class="g2" style="margin-top:10px">${swatches(TH,'setTheme')}</div></div><div class="card"><h3>🖥️ অ্যাডমিন প্যানেলের থিম</h3><small>শুধু এই ব্রাউজারে আপনার অ্যাডমিন প্যানেলের রঙ বদলায়, সাইটে কোনো প্রভাব ফেলে না। উপরের 🎨 বাটন দিয়েও বদলানো যায়।</small><div class="g2" style="margin-top:10px">${swatches(AT,'setAT')}</div></div>`}
async function setTheme(k){const{error}=await sb.from('settings').update({theme:k}).eq('id',1);if(error)return alert(error.message+'\n(patch_02_theme.sql Run করেছেন কি?)');TH=k;renderTh()}
function setAT(k){AT=k;document.documentElement.setAttribute('data-at',k);try{localStorage.setItem('avt',k)}catch(e){}renderTh()}
function cycleAT(){setAT(TH_KEYS[(TH_KEYS.indexOf(AT)+1)%TH_KEYS.length])}
const MFC=`<div class="card"><h3>🔐 দুই-ধাপ নিরাপত্তা (MFA)</h3><p style="margin:0 0 10px">অবস্থা: <b id="mfs">...</b></p><div id="mfa"></div></div>`;
const MTC=`<div class="card" style="border-color:#d68910"><h3>🛠️ রক্ষণাবেক্ষণ মোড</h3><p style="margin:0 0 10px">বর্তমান অবস্থা: <b id="mts"></b></p><button id="mtbtn" onclick="toggleMt()"></button><small style="display:block;margin-top:8px">চালু করলে সাধারণ ভিজিটররা সাইটের বদলে নিচের বার্তাটি দেখবে এবং পোস্ট/লিংক ডেটাও সার্ভার থেকে বন্ধ থাকবে। অ্যাডমিন হিসেবে লগইন থাকলে আপনি সাইট স্বাভাবিক দেখবেন।</small><label>ভিজিটরদের যে বার্তা দেখাবে</label><textarea id="s_maintenance_msg" rows="5"></textarea><small>বার্তা বদলে নিচের "সব Save করুন" চাপুন।</small></div>`;
function mtUI(){if(!$('mts'))return;$('mts').textContent=MT?'🔴 চালু (সাইট বন্ধ)':'🟢 বন্ধ (সাইট স্বাভাবিক)';$('mtbtn').textContent=MT?'✅ সাইট আবার চালু করুন':'🛠️ রক্ষণাবেক্ষণ মোড চালু করুন';$('mtbtn').className=MT?'ok':'w';$('mtb').textContent=MT?'🔴 Maintenance ON':'🟢 Maintenance OFF'}
async function toggleMt(){const n=!MT;if(!confirm(n?'রক্ষণাবেক্ষণ মোড চালু করবেন? সাধারণ ভিজিটররা সাইট দেখতে পাবে না।':'সাইট আবার সবার জন্য চালু করবেন?'))return;const o={maintenance:n};const m=$('s_maintenance_msg');if(m)o.maintenance_msg=m.value;const{error}=await sb.from('settings').update(o).eq('id',1);if(error)return alert(error.message);MT=n;mtUI()}
const SET=[['সাধারণ',[['ticker','উপরের স্ক্রলিং নোটিশ'],['bot_username','টেলিগ্রাম বটের ইউজারনেম (@ ছাড়া)'],['admin_tg','অ্যাডমিনের টেলিগ্রাম লিংক (https://t.me/sgboss27)'],['success_tg','রেজিস্ট্রেশনের পর যে টেলিগ্রাম লিংক দেখাবে (ফাঁকা থাকলে উপরেরটা)']]],['সোশ্যাল',[['tg_channel','টেলিগ্রাম চ্যানেল লিংক (নিচের Join বাটন)'],['fb','ফেসবুক পেজ লিংক']]],['এড প্লেসমেন্ট (Adsterra)',[['adsterra_link','Smart Link — Watch চাপলে আগে নতুন ট্যাবে খুলবে'],['ad_banner','ব্যানার/নেটিভ কোড #১ → ক্যাটাগরি মেনুর নিচে, পোস্টের উপরে দেখাবে','a'],['ad_native','ব্যানার/নেটিভ কোড #২ → পোস্ট গ্রিডের নিচে, পেজ নম্বরের উপরে দেখাবে','a'],['ad_post_mid','পোস্ট পেজ ব্যানার (৩০০×২৫০ সাইজ সবচেয়ে ভালো) → বিবরণের মাঝখানে দেখাবে','a'],['ad_popunder','পপআন্ডার কোড → পুরো সাইটে চলবে','a'],['ad_socialbar','সোশ্যাল বার কোড → পুরো সাইটে চলবে','a'],['adsterra_script','অন্যান্য গ্লোবাল স্ক্রিপ্ট → পুরো সাইটে চলবে','a']]]];
const F=[...SET.flatMap(g=>g[1].map(f=>f[0])),'maintenance_msg'];
function tab(k,b){document.querySelectorAll('.c').forEach(c=>c.classList.toggle('on',c.id==k));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b))}
async function up(fid,tid){const f=$(fid).files[0];if(!f)return;const n=Date.now()+'_'+f.name.replace(/[^\w.]/g,'');const{error}=await sb.storage.from('images').upload(n,f);if(error)return alert(error.message);$(tid).value=sb.storage.from('images').getPublicUrl(n).data.publicUrl;prev();alert('✅ আপলোড হয়েছে')}
function prev(){const v=$('th').value;$('pv').src=v;$('pv').style.display=v?'block':'none'}
async function go(){const{error}=await sb.auth.signInWithPassword({email:$('e').value,password:$('p').value,options:{captchaToken:capToken()}});capReset();if(error)return alert(error.message);chk()}
async function mfGo(){const{data:f,error:e0}=await sb.auth.mfa.listFactors();if(e0)return alert(e0.message);const t=(f.totp||[])[0];if(!t)return alert('MFA ফ্যাক্টর পাওয়া যায়নি');const{error}=await sb.auth.mfa.challengeAndVerify({factorId:t.id,code:$('mc').value.trim()});if(error)return alert(error.message);$('mc').value='';$('mf').style.display='none';chk()}
let MFID;
async function mfUI(){const{data:f}=await sb.auth.mfa.listFactors();const on=(f?.totp||[]).length>0;$('mfs').textContent=on?'🟢 চালু আছে':'🔴 বন্ধ আছে — চালু করার পরামর্শ দিচ্ছি';$('mfa').innerHTML=on?'':'<button class="ok" onclick="mfEnroll()">MFA চালু করুন</button>'}
async function mfEnroll(){const{data,error}=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'admin-'+Date.now()});if(error)return alert(error.message);MFID=data.id;$('mfa').innerHTML=`<p>Google Authenticator বা Authy অ্যাপে এই QR স্ক্যান করুন। একই ফোনে হলে নিচের Secret কপি করে অ্যাপে "setup key" হিসেবে দিন।</p><img src="${esc(data.totp.qr_code)}" alt="QR" style="width:180px;background:#fff;padding:6px;border-radius:8px"><p><small>Secret:</small> <code style="word-break:break-all">${esc(data.totp.secret)}</code></p><input id="mfc" inputmode="numeric" placeholder="অ্যাপের ৬ সংখ্যার কোড"><br><br><button class="ok" onclick="mfVerify()">নিশ্চিত করুন</button>`}
async function mfVerify(){const{error}=await sb.auth.mfa.challengeAndVerify({factorId:MFID,code:$('mfc').value.trim()});if(error)return alert(error.message);alert('✅ MFA চালু হয়েছে। এখন থেকে লগইনে কোড লাগবে।');mfUI()}
async function chk(){const{data:{session}}=await sb.auth.getSession();if(!session)return;
const{data:aal}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();if(aal&&aal.nextLevel==='aal2'&&aal.currentLevel!=='aal2'){$('lg').style.display='none';$('mf').style.display='block';return}const{data}=await sb.from('profiles').select('is_admin').eq('id',session.user.id).maybeSingle();if(!data?.is_admin){await sb.auth.signOut();return alert('এই অ্যাকাউন্ট অ্যাডমিন নয়')}$('lg').style.display='none';$('ap').style.display='block';rst();lp();lu();la();ls()}
async function lp(){const{data}=await sb.from('posts').select('*').order('created_at',{ascending:false}).limit(200);P=data||[];
$('s1').textContent=P.length;$('s2').textContent=P.reduce((a,p)=>a+p.views,0);$('s3').textContent=P.reduce((a,p)=>a+p.clicks,0);
$('pl').innerHTML=P.map((p,i)=>`<div class="row"><img src="${esc(p.thumb)}"><div class="m"><b>${esc(p.title)}</b><span class="bd">${esc(p.category)}</span><span class="bd">${esc(p.type)}</span><small>👁${Number(p.views)} 🖱${Number(p.clicks)} 📈${Number(p.impressions)}</small></div><div class="a"><button class="s" onclick="openF(${i})">✏️</button><button class="d" onclick="dp(${p.id})">🗑</button></div></div>`).join('')||'<p>কোনো পোস্ট নেই</p>'}
async function openF(i){const p=i==null?{}:P[i];$('eid').value=p.id||'';$('ft').textContent=p.id?'পোস্ট এডিট':'নতুন পোস্ট';
$('pt').value=p.title||'';$('pd').value=p.descr||'';$('pg').value=p.tags||'';$('pc').value=p.category||'video';$('py').value=p.type||'normal';$('th').value=p.thumb||'';$('dl').value='';$('tm').value='';prev();
$('pf').style.display='block';$('pf').scrollIntoView();
if(p.id){const{data}=await sb.from('post_links').select('*').eq('post_id',p.id).maybeSingle();$('dl').value=data?.direct_link||'';$('tm').value=data?.tg_msg_id||''}}
async function savePost(){if(!$('pt').value)return alert('টাইটেল দিন');if(bad($('dl').value)||bad($('th').value))return alert('লিংকে javascript:/data: ব্যবহার করা যাবে না');if(!$('dl').value&&!$('tm').value)return alert('Direct Link অথবা Telegram Message ID দিন');
const o={title:$('pt').value,descr:$('pd').value,tags:$('pg').value,category:$('pc').value,type:$('py').value,thumb:$('th').value};let id=$('eid').value;
if(id){const r=await sb.from('posts').update(o).eq('id',id);if(r.error)return alert(r.error.message)}else{const r=await sb.from('posts').insert(o).select().single();if(r.error)return alert(r.error.message);id=r.data.id}
const r2=await sb.from('post_links').upsert({post_id:id,direct_link:$('dl').value||null,tg_msg_id:$('tm').value||null});if(r2.error)return alert(r2.error.message);
$('pf').style.display='none';lp();alert('✅ Saved')}
async function dp(id){if(confirm('পোস্ট ডিলিট করবেন?')){await sb.from('posts').delete().eq('id',id);lp()}}
async function lu(){const{data}=await sb.from('profiles').select('*').order('created_at',{ascending:false});const U=data||[];
const g=(s,t)=>{const l=U.filter(u=>u.status==s);return `<div class="card"><h4>${t} (${l.length})</h4>${l.map(u=>`<div class="row"><div class="m"><b>${esc(u.email)}</b><small>@${esc(u.tg_username||'-')}</small></div><div class="a">${s!='approved'?`<button class="ok" onclick="us('${u.id}','approved')">Approve</button>`:`<button class="w" onclick="us('${u.id}','pending')">Revoke</button>`}${s!='disabled'?`<button class="s" onclick="us('${u.id}','disabled')">Disable</button>`:''}<button class="d" onclick="du('${u.id}')">Delete</button></div></div>`).join('')||'<small>কেউ নেই</small>'}</div>`};
$('ul').innerHTML=g('pending','⏳ অনুমোদনের অপেক্ষায়')+g('approved','✅ প্রিমিয়াম ইউজার')+g('disabled','⛔ বন্ধ করা')}
async function us(id,s){await sb.from('profiles').update({status:s}).eq('id',id);lu()}
async function du(id){if(confirm('অ্যাকাউন্ট পুরোপুরি ডিলিট হবে। নিশ্চিত?')){const{error}=await sb.rpc('delete_user',{uid:id});if(error)alert(error.message);lu()}}
async function la(){const{data}=await sb.from('ads').select('*').order('id',{ascending:false});$('al').innerHTML=(data||[]).map(a=>`<div class="row"><img src="${esc(a.image_url)}"><div class="m"><b>${a.kind=='popup'?'পপ-আপ':'ব্যানার'}</b><small>🖱 ${a.clicks} ${a.expires_at?'• শেষ: '+new Date(a.expires_at).toLocaleString():''}</small></div><button class="d" onclick="da(${a.id})">🗑</button></div>`).join('')||'<p>কোনো বিজ্ঞাপন নেই</p>'}
async function saveAd(){if(!$('ai').value||!$('alk').value)return alert('ছবি ও লিংক দিন');if(bad($('ai').value)||bad($('alk').value))return alert('লিংকে javascript:/data: ব্যবহার করা যাবে না');const{error}=await sb.from('ads').insert({kind:$('ak').value,image_url:$('ai').value,link:$('alk').value,expires_at:$('ae').value?new Date($('ae').value).toISOString():null});if(error)return alert(error.message);$('ai').value=$('alk').value='';la()}
async function da(id){await sb.from('ads').delete().eq('id',id);la()}
async function ls(){const{data}=await sb.from('settings').select('*').eq('id',1).single();MT=!!data?.maintenance;TH=data?.theme||'neon';
$('sf').innerHTML=MTC+'<div id="thc"></div>'+MFC+SET.map(([t,fs])=>`<div class="card"><h3>${t}</h3>${fs.map(([k,l,ty])=>`<label>${l}</label>${ty=='a'?`<textarea id="s_${k}" rows="4"></textarea>`:`<input id="s_${k}">`}`).join('')}</div>`).join('');
F.forEach(k=>$('s_'+k).value=data?.[k]||'');mtUI();mfUI();renderTh()}
async function saveSet(){const o={};F.forEach(k=>o[k]=$('s_'+k).value);if(['adsterra_link','tg_channel','fb','admin_tg','success_tg'].some(k=>bad(o[k])))return alert('লিংকে javascript:/data: ব্যবহার করা যাবে না');const{error}=await sb.from('settings').update(o).eq('id',1);alert(error?error.message:'✅ Saved')}
capInit('cf');chk()</script></body></html>
